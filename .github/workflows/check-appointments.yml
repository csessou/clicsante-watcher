name: Check Lachine blood-test appointments

on:
  schedule:
    # Every ten minutes, offset from the top of the hour to reduce delays.
    # GitHub Actions schedules are best-effort and can run late or be skipped.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test ntfy push instead of checking appointments"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: clicsante-lachine-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      # Ubuntu runners already have python3 installed; skip setup to save time.
      - name: Check publicly listed appointment dates
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.test_notification }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_START: "2026-10-12"
          WATCH_END: "2026-10-31"
        run: python3 check.py
      - name: Send one test notification to ntfy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 - <<'PY'
          import os
          from check import request_json
          topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not topic:
              raise SystemExit("Error: NTFY_TOPIC repository secret is missing")
          request_json("https://ntfy.sh/", method="POST", payload={
              "topic": topic,
              "title": "Clic Sante watcher - TEST",
              "message": "Test push from GitHub Actions. Normal monitoring remains October 12-31.",
              "priority": 4,
          })
          print("Test notification accepted by ntfy.")
          PY
